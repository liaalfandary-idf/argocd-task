# Default values for argocd-task.

replicaCount: 1

# Official nginx image, run as its built-in non-root "nginx" user (UID 101).
# Pin an exact patch version (never "latest") and bump it deliberately.
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.31.7-alpine"

imagePullSecrets: []
nameOverride: ""
# Fixed name: it is baked into the TLS certificate (CN and SANs), see scripts/issue-tls-cert.sh
fullnameOverride: lia-temp-page

serviceAccount:
  create: true
  # The pod never talks to the Kubernetes API, so don't give it a token
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
  # Lets the non-root nginx user bind port 443 inside this pod's own network namespace.
  # A "safe" sysctl: allowed by the restricted Pod Security Standard, no root or capabilities needed.
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# nginx listens for HTTPS on the standard port inside the pod (see sysctls above)
containerPort: 443

service:
  type: ClusterIP
  port: 443

# Public hostnames - the ONLY place they are written. Everything else is derived from this list:
# Traefik HostSNI match, nginx server_name, certificate SANs (scripts/issue-tls-cert.sh), helm test.
# After adding a host, re-run scripts/issue-tls-cert.sh so the certificate covers it.
hosts:
  - lia-temp-page.localhost

tls:
  # kubernetes.io/tls Secret with the server certificate signed by "ArgoCD Local CA".
  # Created outside Git by scripts/issue-tls-cert.sh (the private key never goes in the repo).
  # Empty = "<fullname>-tls". The Secret must exist before the pod can start.
  secretName: ""
  # Public CA certificate (files/ca.crt) published as ConfigMap "<fullname>-ca" so clients
  # in the namespace can verify the server
  caConfigMap:
    enabled: true

# Traefik IngressRouteTCP on the websecure entrypoint with TLS passthrough
# (same as the argocd-server route): Traefik routes on SNI only, nginx terminates TLS.
ingressRouteTCP:
  enabled: true
  entryPoint: websecure

# Only Traefik may reach the pod; nginx may only reply to its allowed peers
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  ingressPodLabels:
    app.kubernetes.io/name: traefik

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Probes hit /healthz on nginx's catch-all server, so they need no Host header
livenessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Extra volumes / mounts (html, nginx config, TLS, cache and run volumes are built in)
volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

subjects:
  - Bruno
  - Aliya
  - Tay
  - Sky
  - Toffee
  - Lexy
  - Pekan

colors:
  - blue
  - red
  - green

page:
  title: ArgoCD task temp
