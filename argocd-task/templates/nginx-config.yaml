apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argocd-task.fullname" . }}-nginx
  labels:
    {{- include "argocd-task.labels" . | nindent 4 }}
data:
  default.conf: |-
    # Requests for any name not on the certificate are refused (421)
    server {
        listen {{ .Values.containerPort }} ssl default_server;
        http2 on;
        server_tokens off;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Kubelet probes connect by pod IP, so they land here
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 421;
        }
    }

    server {
        listen {{ .Values.containerPort }} ssl;
        http2 on;
        server_name {{ include "argocd-task.dnsNames" . }};
        server_tokens off;

        # TLS: modern protocols and AEAD ciphers only
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Static page: no request bodies, read-only methods
        client_max_body_size 1k;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
