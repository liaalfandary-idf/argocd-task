{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argocd-task.fullname" . }}
  labels:
    {{- include "argocd-task.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "argocd-task.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik (TLS passthrough)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
          {{- with .Values.networkPolicy.ingressPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: https
          protocol: TCP
    # The chart's own `helm test` pod
    - from:
        - podSelector:
            matchLabels:
              {{ include "argocd-task.fullname" . }}-client: "true"
      ports:
        - port: https
          protocol: TCP
  # This cluster's CNI (kindnet) also filters reply packets, so nginx's replies need an
  # egress rule. Egress is allowed only back to the same peers as ingress; nginx can't
  # reach DNS, the Kubernetes API or the internet.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
          {{- with .Values.networkPolicy.ingressPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{ include "argocd-task.fullname" . }}-client: "true"
{{- end }}
